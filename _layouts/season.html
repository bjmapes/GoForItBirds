---
layout: default
---

<h1>{{ page.title }}</h1>

{% assign seasons = site.data.games_index | where: "season", page.season | first %}
{% assign games = seasons.games | sort: "week" %}

<ul class="tile-list">
{% for game in games %}
  <li>
    <a href="{{ site.baseurl }}/games/{{ game.game_id | downcase | replace: '_', '-' }}.html">
      Wk {{ game.week }} - {{ game.away }} at {{ game.home }}
    </a>
  </li>
{% endfor %}
</ul>
