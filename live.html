---
layout: default
title: Live Analysis
---

<h1>{{ page.title }}</h1>

<div id="live-root" class="tile-list full"></div>

<script>
(function(){
  const URL = '{{ "/assets/data/current_game.csv" | relative_url }}';
  const root = document.getElementById('live-root');

  // Helper: robust CSV parser (handles quotes)
  function parseCSVRobust(text){
    const rows = [];
    let i = 0, field = '', row = [], inQuotes = false;
    const pushField = () => { row.push(field); field = ''; };
    const pushRow = () => { rows.push(row); row = []; };
    while (i < text.length){
      const c = text[i++];
      if (inQuotes){
        if (c === '"'){
          if (text[i] === '"'){ field += '"'; i++; }
          else { inQuotes = false; }
        } else { field += c; }
      } else {
        if (c === '"') { inQuotes = true; }
        else if (c === ',') { pushField(); }
        else if (c === '\n') { pushField(); pushRow(); }
        else if (c === '\r') { /* ignore */ }
        else { field += c; }
      }
    }
    if (field.length || row.length) { pushField(); pushRow(); }
    const header = rows.shift();
    return { header, rows: rows.map(r => {
      const o = {}; header.forEach((h,idx)=>o[h]=r[idx]??''); return o;
    }) };
  }

  (async function(){
    root.textContent = 'Loading…';
    const res = await fetch(URL, { cache: 'no-store' });
    if(!res.ok){ root.textContent = 'Failed to load current_game.csv'; return; }
    const { header: h, rows: plays } = parseCSVRobust(await res.text());
    root.innerHTML = '';
    if (!plays || plays.length === 0){
      root.textContent = 'No rows in current_game.csv';
      return;
    }
    // Show header using first row
    const r = plays[0];
    const header = document.querySelector('h1');
    //header.textContent = `Week ${r.week} — ${r.away_team} at ${r.home_team} - ` + header.textContent; //TODO add back in after getting from espn live
    header.textContent = `Week X — ${r.away_team} at ${r.home_team} - ` + header.textContent;

    // Filter to PHI opponent defense and 4th down
    const phi4th = plays
      .filter(p => p.posteam === 'PHI')
      .map(p => ({ 
        ...p, 
        down: "4",
        phi_coach: "[phi coach]"
      }));


    for (const p of phi4th){
      const li = document.createElement('li');

      li.innerHTML = `
        <div class="tile-play">
          <div class="tile-play-status">
            <div>Q${p.qtr||''} ${p.game_clock||''} • ${p.down||''}th &amp; ${p.ydstogo||''} at ${p.yrdln||''}</div>
            <div>${p.away_team||''} ${p.away_score||''} - ${p.home_team||''} ${p.home_score||''}</div>
            <div>Model: ${p.model_recommendation||''}</div>
            <div>${p.phi_coach||''}: ${p.actual_decision_calculated||''}</div>
          </div>
          <div class="tile-play-description"><div>${p.desc||''}</div></div>
          <div class="tile-play-table">
            <table>
              <thead>
                <tr><th></th><th>Win%</th><th>Success%</th><th>Win% if Fail</th><th>Win% if Succeed</th></tr>
              </thead>
              <tbody>
                <tr>
                  <td>Go for it</td>
                  <td>${p.go_wp_pct||''}</td>
                  <td>${p.first_down_prob_pct||''}</td>
                  <td>${p.wp_fail_pct||''}</td>
                  <td>${p.wp_succeed_pct||''}</td>
                </tr>
                <tr>
                  <td>Punt</td>
                  <td>${p.punt_wp_pct||''}</td>
                  <td>NA</td><td>NA</td><td>NA</td>
                </tr>
                <tr>
                  <td>Field goal</td>
                  <td>${p.fg_wp_pct||''}</td>
                  <td>${p.fg_prob_calculated_pct||''}</td>
                  <td>${p.miss_fg_wp_pct||''}</td>
                  <td>${p.make_fg_wp_pct||''}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>`;
      root.appendChild(li);
    }
  })();
})();
</script>
