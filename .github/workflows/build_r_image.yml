name: build-r-image
on:
  push:
    paths: [Dockerfile]
  workflow_dispatch:
permissions: { contents: read, packages: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/r:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/r:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/r:buildcache,mode=max