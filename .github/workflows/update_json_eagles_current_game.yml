name: update-json-eagles-current-game
on: { workflow_dispatch: {} }
permissions: { contents: read, packages: write }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and push image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/r:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/r:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/r:buildcache,mode=max

  scrape:
    runs-on: ubuntu-latest
    needs: build
    container: ghcr.io/${{ github.repository }}/r:latest
    steps:
      - uses: actions/checkout@v4
      - run: Rscript -e "library(nflfastR); pbp <- fast_scraper(2025, weeks = 1, teams = 'PHI'); print(head(pbp))"