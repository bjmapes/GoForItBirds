name: update-json-eagles-current-game
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  scrape:
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository }}/r:latest
    steps:
      - uses: actions/checkout@v4
      - run: Rscript -e "library(nflfastR); pbp <- fast_scraper(2025, weeks = 1, teams = 'PHI'); print(head(pbp))"