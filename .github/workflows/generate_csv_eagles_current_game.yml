name: generate-csv-eagles-current-game
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  scrape:
    runs-on: ubuntu-latest
    container: ghcr.io/bjmapes/goforitbirds/r:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run current game generator
        run: Rscript scripts/generate_csv_eagles_current_game.R
      - name: List assets dir
        run: ls -l assets/data
      - name: Commit CSV if changed
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.email "actions@users.noreply.github.com"
          git config user.name "github-actions"
          git add assets/data/current_game.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git pull --ff-only
            git commit -m "chore: update current_game.csv"
            git push
          fi